<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VideoHub</title>

    <link rel="preconnect" href="https://vidlyx.cc">
    <link rel="dns-prefetch" href="https://vidlyx.cc">
    <link rel="preconnect" href="https://abacus.jasoncameron.dev">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0d;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            height: 64px;
            background: #151518;
            border-bottom: 1px solid #29292d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #ff3b5c;
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #aaa;
            font-size: 13px;
            white-space: nowrap;
        }

        main {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 24px 15px 50px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        #videos {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .video-card {
            background: #151518;
            border: 1px solid #29292d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.35);
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .video-info {
            padding: 15px 17px;
        }

        .video-title {
            font-size: 17px;
            font-weight: 600;
        }

        .video-meta {
            margin-top: 0;
            color: #888;
            font-size: 13px;
        }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
        }

        .pagination button {
            min-width: 40px;
            height: 40px;
            padding: 0 14px;
            background: #151518;
            color: #fff;
            border: 1px solid #29292d;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled) {
            border-color: #ff3b5c;
        }

        .pagination button.active {
            background: #ff3b5c;
            border-color: #ff3b5c;
            font-weight: 700;
        }

        .pagination button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 13px;
            padding: 25px 15px;
            border-top: 1px solid #222;
        }

        @media (max-width: 600px) {
            header { height: 56px; padding: 0 12px; }
            .logo { font-size: 19px; }
            .stats { font-size: 11px; gap: 10px; }
            main { padding: 18px 10px 35px; }
            .section-title { font-size: 18px; }
            #videos { gap: 16px; }
            .video-card { border-radius: 8px; }
            .video-info { padding: 12px; }
            .video-title { font-size: 15px; }
            .pagination button { min-width: 36px; height: 36px; padding: 0 10px; }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Video<span>Hub</span></div>
        <div class="stats">
            <span id="visits"></span>
            <span id="plays"></span>
        </div>
    </header>

    <main>
        <div class="section-title">Latest Videos</div>
        <div id="videos"></div>
        <div class="pagination" id="pagination"></div>
    </main>

    <footer>© 2026 VideoHub</footer>

    <script>
        /* ========= الإعدادات ========= */
        const PER_PAGE = 8; // عدد الفيديوهات في الصفحة

        // اسم خاص بموقعك للعدادات (متغيروش وإلا الأرقام هتبدأ من الصفر)
        const NAMESPACE = "videohub-k7q2x9";
        const COUNTER_API = "https://abacus.jasoncameron.dev";

        // دومين المشغل
        const PLAYER_BASE = "https://vidlyx.cc/e/";

        // مفاتيح العدادات الإجمالية
        const KEY_SITE = "site";               // إجمالي الزيارات
        const KEY_TOTAL_PLAYS = "total_plays"; // إجمالي مرات تشغيل كل الفيديوهات

        // أضف أي فيديو جديد هنا: حط الـ ID بس (الجزء اللي بعد /e/)
        const videoIds = [
            "7ik8xsd39fy", "8ujnipp3ad5", "8ionelod0h9", "017yhrquwiz",
            "jmwh0v606dq", "4nd1t3li5u3", "2k45hsnu37o", "zpcrvewkkxi",
            "1gw2f6ako9a", "w052pxyuxwc", "o5jg9dr2cty", "6ggex3yx7qd",
            "a9b99v5ntpd", "v489m8az920", "fa73q7ewb9n", "wiagcuk8v1s",
            "90oy2t1zkiu", "oyrrs6wc17l", "mkzvvsifkt2", "8he5vlgf5v9",
            "jlit1psxvlf", "bkglgp29zqp", "lypnnoqrq2q", "k9vqxlmymp3",
            "6k3n9fyo533", "dp16fhz1318", "007us6immlh", "kzh4hytwgc0",
            "37f8jk1ko3k", "okuh3r3jirs"
        ];

        // خلط عشوائي للفيديوهات مع كل تحميل للصفحة (Fisher-Yates)
        for (let i = videoIds.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [videoIds[i], videoIds[j]] = [videoIds[j], videoIds[i]];
        }

        /* ========= العدادات ========= */
        const stats = {};
        const fmt = n => Number(n || 0).toLocaleString("en-US");

        async function counterRequest(action, key) {
            try {
                const res = await fetch(COUNTER_API + "/" + action + "/" + NAMESPACE + "/" + key);
                if (!res.ok) return 0;
                const data = await res.json();
                return Number(data.value) || 0;
            } catch (e) {
                return null;
            }
        }

        function updateViewsUI() {
            document.querySelectorAll("[data-views]").forEach(function (el) {
                const v = stats[el.dataset.views];
                el.textContent = "👁 " + (v !== undefined ? fmt(v) : "...") + " views";
            });
            if (stats[KEY_SITE] !== undefined) {
                document.getElementById("visits").textContent = "👥 " + fmt(stats[KEY_SITE]) + " visits";
            }
            if (stats[KEY_TOTAL_PLAYS] !== undefined) {
                document.getElementById("plays").textContent = "▶ " + fmt(stats[KEY_TOTAL_PLAYS]) + " plays";
            }
        }

        async function loadPageStats(ids) {
            await Promise.all(ids.map(async function (id) {
                if (stats[id] !== undefined) return;
                const v = await counterRequest("get", id);
                if (v !== null) stats[id] = v;
            }));
            updateViewsUI();
        }

        // زيارة الموقع: مرة واحدة لكل جلسة (الرفرش مبيزودهاش)
        // + جلب إجمالي مرات التشغيل لعرضه في الهيدر
        async function trackVisit() {
            let first = false;
            try {
                first = !sessionStorage.getItem("visited");
                if (first) sessionStorage.setItem("visited", "1");
            } catch (e) {}

            const results = await Promise.all([
                counterRequest(first ? "hit" : "get", KEY_SITE),
                counterRequest("get", KEY_TOTAL_PLAYS)
            ]);

            if (results[0] !== null) stats[KEY_SITE] = results[0];
            if (results[1] !== null) stats[KEY_TOTAL_PLAYS] = results[1];
            updateViewsUI();
        }

        // مشاهدة الفيديو: مرة واحدة لكل فيديو في الجلسة
        // بتزود عداد الفيديو نفسه + عداد إجمالي التشغيل لكل الفيديوهات
        async function trackPlay(id) {
            const key = "played_" + id;
            try {
                if (sessionStorage.getItem(key)) return;
                sessionStorage.setItem(key, "1");
            } catch (e) {}

            const results = await Promise.all([
                counterRequest("hit", id),
                counterRequest("hit", KEY_TOTAL_PLAYS)
            ]);

            if (results[0] !== null) stats[id] = results[0];
            if (results[1] !== null) stats[KEY_TOTAL_PLAYS] = results[1];
            updateViewsUI();
        }

        /* ========= اكتشاف التشغيل =========
           الـ iframe من دومين تاني فمقدرش أقرأ حالة المشغل،
           فبنعتبر الضغط جوه الفيديو = تشغيل.
           الاكتشاف بيتم بطريقتين:
           1) blur: لما الزائر يضغط على iframe الصفحة بتفقد التركيز
           2) polling خفيف: عشان نلقط الانتقال من فيديو لفيديو تاني
              (في الحالة دي حدث blur مبيحصلش) */
        let lastFocusedId = null;

        function checkIframeFocus() {
            const el = document.activeElement;
            if (el && el.tagName === "IFRAME" && el.dataset.id) {
                if (el.dataset.id !== lastFocusedId) {
                    lastFocusedId = el.dataset.id;
                    trackPlay(el.dataset.id);
                }
            } else {
                lastFocusedId = null;
            }
        }

        window.addEventListener("blur", function () {
            setTimeout(checkIframeFocus, 0);
        });
        setInterval(checkIframeFocus, 400);

        /* ========= العرض ========= */
        const totalPages = Math.ceil(videoIds.length / PER_PAGE);
        const container = document.getElementById("videos");
        const pagination = document.getElementById("pagination");

        function getPageFromUrl() {
            const p = parseInt(new URLSearchParams(location.search).get("page"), 10);
            return p >= 1 && p <= totalPages ? p : 1;
        }

        function renderVideos(page) {
            container.innerHTML = "";
            lastFocusedId = null;
            const start = (page - 1) * PER_PAGE;
            const pageIds = videoIds.slice(start, start + PER_PAGE);

            pageIds.forEach(function (id, i) {
                const card = document.createElement("div");
                card.className = "video-card";
                card.innerHTML =
                    '<div class="video-wrapper">' +
                        '<iframe data-id="' + id + '" src="' + PLAYER_BASE + id + '" ' +
                        'loading="lazy" scrolling="no" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>' +
                    '</div>' +
                    '<div class="video-info">' +
                        '<div class="video-meta"><span data-views="' + id + '">👁 ' +
                        (stats[id] !== undefined ? fmt(stats[id]) : "...") + ' views</span></div>' +
                    '</div>';
                container.appendChild(card);
            });

            loadPageStats(pageIds);
        }

        function renderPagination(page) {
            pagination.innerHTML = "";

            function makeBtn(label, target, opts) {
                opts = opts || {};
                const b = document.createElement("button");
                b.textContent = label;
                if (opts.active) b.classList.add("active");
                if (opts.disabled) b.disabled = true;
                b.onclick = function () { goToPage(target); };
                pagination.appendChild(b);
            }

            makeBtn("« Prev", page - 1, { disabled: page === 1 });
            for (let p = 1; p <= totalPages; p++) {
                makeBtn(p, p, { active: p === page });
            }
            makeBtn("Next »", page + 1, { disabled: page === totalPages });
        }

        function goToPage(page) {
            try { history.pushState({}, "", "?page=" + page); } catch (e) {}
            showPage(page);
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function showPage(page) {
            renderVideos(page);
            renderPagination(page);
        }

        window.addEventListener("popstate", function () { showPage(getPageFromUrl()); });

        /* ========= التشغيل ========= */
        showPage(getPageFromUrl());
        trackVisit();
    </script>

</body>
</html>
